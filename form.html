<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modulo Anagrafica Cliente</title>
</head>
<body>
    <h1>Modulo Anagrafica Cliente</h1>
    <form action="index.php" method="POST">
        <h2>Dati Cliente</h2>
        <label for="nome">Nome:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="cognome">Cognome:</label>
        <input type="text" id="cognome" name="cognome" required><br><br>

        <label for="ragione_sociale">Ragione Sociale:</label>
        <input type="text" id="ragione_sociale" name="ragione_sociale" required><br><br>

        <label for="indirizzo">Indirizzo:</label>
        <input type="text" id="indirizzo" name="indirizzo" required><br><br>

        <label for="piva">Partita IVA:</label>
        <input type="text" id="piva" name="piva" required><br><br>

        <h2>Dati Prodotto Acquistato</h2>
        <label for="descrizione">Descrizione Prodotto:</label>
        <input type="text" id="descrizione" name="descrizione" required><br><br>

        <label for="codice">Codice Prodotto:</label>
        <input type="text" id="codice" name="codice" required><br><br>

        <label for="giacenza">Giacenza:</label>
        <input type="number" id="giacenza" name="giacenza" required><br><br>

        <label for="prezzo_unitario">Prezzo Unitario (€):</label>
        <input type="number" step="0.01" id="prezzo_unitario" name="prezzo_unitario" required><br><br>

        <label for="quantita">Quantità:</label>
        <input type="number" id="quantita" name="quantita" required><br><br>

        <label for="percentuale">Percentuale di Sconto:</label>
        <input type="number" step="0.01" id="percentuale" name="percentuale" required><br><br>

        <input type="submit" value="Calcola Prezzo">
    </form>
</body>
</html>
